spring.application.name=SneakHubApi
# Puerto 8081 por defecto (se puede cambiar con la variable de entorno PORT).
server.port=${PORT:8081}

# Base de datos H2 en archivo (./data/sneakhub.mv.db): los datos se conservan al reiniciar.
spring.datasource.url=jdbc:h2:file:./data/sneakhub
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de la BD: http://localhost:8081/h2-console  (JDBC URL: jdbc:h2:file:./data/sneakhub, usuario: sa)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT: clave de firma (mínimo 32 caracteres) y duración de los tokens.
app.jwt.secret=sneakhub-clave-secreta-parcial-2-cambiar-en-produccion
app.jwt.access-expiration-minutes=60
app.jwt.refresh-expiration-days=7
